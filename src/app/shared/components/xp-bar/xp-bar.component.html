<!-- src/app/shared/components/xp-bar/xp-bar.component.html -->
<div class="xp-bar">
  <div class="xp-bar__rank">
    <span class="xp-bar__rank-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M12 3 4 7v5c0 5 3.4 8.5 8 9 4.6-.5 8-4 8-9V7l-8-4Z" />
        <path d="M9 12l2 2 4-5" />
      </svg>
    </span>
    <span class="xp-bar__rank-name" [style.color]="rankColor()">
      {{ profile().rank }}
    </span>
    <span class="xp-bar__streak">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <path d="M12 2s4 4.5 4 8a4 4 0 0 1-8 0c0-2 1-3.5 2-5 0 0-6 3.5-6 10a8 8 0 0 0 16 0c0-5-4-9-8-13Z" />
      </svg>
      {{ profile().currentStreak }}
    </span>
  </div>

  <div class="xp-bar__progress-track">
    <div
      class="xp-bar__progress-fill"
      [style.width.%]="progressPercent()"
      [style.background]="rankColor()">
    </div>
  </div>

  <div class="xp-bar__label">
    <span>{{ profile().xpPoints }} XP</span>
    <span *ngIf="profile().xpToNextRank > 0">
      {{ profile().xpToNextRank }} XP to next rank
    </span>
    <span *ngIf="profile().xpToNextRank === 0">
      Max Rank
    </span>
  </div>
</div>
